<div class="calculator">

  <h1>Calculator</h1>

  <!-- Display -->
  <div class="display">

    <p class="operation-display">
      {{ number1 }} {{ operation }} {{ number2 }}
    </p>

    <p class="result">
      {{ formatResult() }}
    </p>

    @if (error) {
      <p class="error">{{ error }}</p>
    }

  </div>

  <!-- Buttons -->
  <div class="buttons">

    <button class="clear-btn" (click)="clear()">AC</button>
    <button (click)="backspace()">⌫</button>
    <button (click)="percentage()">%</button>
    <button class="operation-btn" (click)="selectOperation('+')">+</button>

    <button (click)="addNumber(7)">7</button>
    <button (click)="addNumber(8)">8</button>
    <button (click)="addNumber(9)">9</button>
    <button class="operation-btn" (click)="selectOperation('*')">×</button>

    <button (click)="addNumber(4)">4</button>
    <button (click)="addNumber(5)">5</button>
    <button (click)="addNumber(6)">6</button>
    <button class="operation-btn" (click)="selectOperation('-')">−</button>

    <button (click)="addNumber(1)">1</button>
    <button (click)="addNumber(2)">2</button>
    <button (click)="addNumber(3)">3</button>
    <button class="operation-btn" (click)="selectOperation('/')">÷</button>

    <button (click)="changeSign()">±</button>
    <button (click)="addNumber(0)">0</button>
    <button (click)="addDecimal()">.</button>
    <button class="calculate-btn" (click)="calculate()">=</button>

  </div>

  <!-- History -->
  <div class="history">

    <div class="history-header">
      <h2>History</h2>

      <button (click)="clearHistory()">
        Clear History
      </button>
    </div>

    @for (item of history; track $index) {
      <p>{{ item }}</p>
    }

  </div>

</div>
